name: Bug report
description: Report a problem in ORCA-HVN docs, scripts, commands, or skills.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken or misleading?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, command, file, or workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
      description: What should change, and what observable result will confirm the fix?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and QA
      description: Relevant checks, platforms, or evidence needed to verify the fix.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and release target
      description: Blocking issues, linked work, or target version if known.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include OS, shell, agent client, or MCP details if relevant.
