name: Feature request
description: Suggest an improvement to ORCA-HVN.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What workflow should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the command, skill, template, script, or doc change.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and out of scope
      description: What should change, and what should remain outside this issue?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions required for completion.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and release target
      description: Blocking issues, linked work, or target version if known.
  - type: textarea
    id: verification
    attributes:
      label: Verification, risk, and QA
      description: Required checks, relevant risks, and QA evidence.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Commands
        - Skills
        - Templates
        - Installation
        - QA
        - Documentation
        - CI
    validations:
      required: true
