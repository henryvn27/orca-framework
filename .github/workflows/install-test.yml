name: Install Test

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Local install
        run: |
          ./install/install.sh --mode local --target /tmp/orca-local
          ./install/verify-install.sh --target /tmp/orca-local
          ./install/doctor.sh --target /tmp/orca-local --harness generic --services github,linear
