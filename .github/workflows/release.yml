name: Release

on:
  push:
    tags:
      - "v1.0.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source
        run: ./scripts/validate-repo.sh
      - name: Build deterministic artifacts
        run: python3 scripts/package-release.py --output dist
      - name: Verify packaged installs
        run: ./scripts/check-release-artifacts.sh
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Orca 1.0.0" --notes-file docs/release-notes-1.0.0.md
