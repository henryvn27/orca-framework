site_name: Orca Mission Control
site_description: Local mission control for AI coding work
site_url: https://henryvn27.github.io/orca-framework/
repo_name: henryvn27/orca-framework
repo_url: https://github.com/henryvn27/orca-framework
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/orca.png
  favicon: assets/orca.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - fenced_code
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

hooks:
  - scripts/mkdocs_repo_links.py

extra:
  repository_ref: main

# The compact navigation is intentional; the full long-form corpus remains
# discoverable through the documentation catalog and search.
not_in_nav: |
  **

nav:
  - Home: index.md
  - Start Here:
      - Documentation Home: documentation-home.md
      - Full Documentation Catalog: catalog.md
      - First 10 Minutes: first-10-minutes.md
      - What Orca Is: intro.md
      - Mission Control Dashboard: mission-control.md
      - Start Here: start-here.md
      - Quickstart: quickstart.md
      - First Run: first-run.md
      - First Workflow: first-workflow.md
      - Mission Portability: portability.md
      - Beginners Guide: guides/beginners-guide.md
  - Demo And Proof:
      - Mission Control Demo: demo.md
      - Proof And Outcomes: proof.md
      - Feature Index: feature-index.md
      - Command Index: command-index.md
      - Releases And Verification: releases.md
  - Optional Workflows:
      - Choose Your Path: choose-your-path.md
      - Agent Orchestration: agent-orchestration.md
      - Goal Mode: guides/goal-mode-guide.md
      - Background Mode: guides/background-mode-guide.md
      - Explanation Mode: explanation-mode.md
      - Side Sessions: side-sessions.md
  - Hosts:
      - Compatibility Matrix: compatibility-matrix.md
      - Codex CLI: hosts/codex-cli.md
      - Claude Code: hosts/claude-code.md
  - Wrapped Packs:
      - Overview: wrapped-capability-packs.md
      - Impeccable: impeccable-pack.md
      - Superpowers: superpowers-pack.md
  - Extension Reference:
      - Architecture: architecture.md
      - Product And Workflow Commands: commands.md
      - Optional Skills: skills.md
      - Use Case Map: use-case-map.md
      - Glossary: glossary.md
      - Philosophy: philosophy.md
  - Contributing:
